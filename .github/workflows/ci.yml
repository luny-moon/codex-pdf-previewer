name: Cross-platform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10']
        include:
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Runtime, Unicode paths, concurrent sessions and package privacy
        run: python -m unittest discover -s tests -v
      - name: Build and audit the release archive
        run: python scripts/build_release.py --out-dir build
      - name: Install browser test dependency
        run: python -m pip install playwright
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium (macOS and Windows)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Check canvas sampling, selection, navigation and refresh
        run: python tests/browser_smoke.py
